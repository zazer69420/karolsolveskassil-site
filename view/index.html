<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071629">
  <meta name="robots" content="noindex">
  <title>Solution · karolsolveskassil.ca</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    :root {
      color-scheme: light;
      --night: #071629;
      --ink: #102b42;
      --muted: #63798a;
      --paper: #e9eff4;
      --white: #ffffff;
      --line: #d8e3ea;
      --cyan: #18b7d6;
      --blue: #1769e0;
      --orange: #ff8a3d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      background: var(--paper);
      color: var(--ink);
      font: 400 1rem/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    a:focus-visible, button:focus-visible, .pages:focus-visible {
      outline: 3px solid var(--orange);
      outline-offset: 3px;
    }

    /* Top bar: back link, solution title, zoom and download. */
    .viewer-bar {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 18px;
      padding: 12px 20px;
      background: var(--night);
      color: #fff;
      box-shadow: 0 6px 20px rgba(7, 22, 41, .25);
    }
    .back-link {
      flex: none;
      color: #d9e6ee;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }
    .back-link:hover { color: #fff; }
    .back-link span { color: var(--orange); }
    .doc-title { flex: 1 1 240px; min-width: 0; margin: 0; }
    .doc-title strong { display: block; font-size: 1.1rem; line-height: 1.25; overflow-wrap: anywhere; }
    .doc-title span { display: block; color: var(--cyan); font-size: .78rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .zoom-group {
      display: inline-flex;
      align-items: center;
      border: 1px solid #2b4762;
      border-radius: 10px;
      overflow: hidden;
    }
    .zoom-group button {
      min-width: 40px;
      height: 38px;
      padding: 0 10px;
      border: 0;
      background: transparent;
      color: #fff;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    .zoom-group button:hover:not(:disabled) { background: #12304d; }
    .zoom-group button:disabled { opacity: .45; cursor: default; }
    .zoom-group .zoom-level { min-width: 64px; border-left: 1px solid #2b4762; border-right: 1px solid #2b4762; font-variant-numeric: tabular-nums; }
    .bar-button {
      display: inline-flex;
      align-items: center;
      height: 38px;
      padding: 0 14px;
      border-radius: 10px;
      background: var(--blue);
      color: #fff;
      font-weight: 800;
      font-size: .92rem;
      letter-spacing: .04em;
      text-decoration: none;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .bar-button:hover { filter: brightness(1.1); }

    /* Pages column. */
    .pages {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 18px;
      padding: 24px 16px 64px;
      overflow-x: auto;
    }
    .page {
      position: relative;
      flex: none;
      max-width: none;
      margin: 0 auto; /* Centred when it fits; scrolls sideways when zoomed wider than the screen. */
      background: var(--white);
      border-radius: 4px;
      box-shadow: 0 10px 30px rgba(7, 22, 41, .14);
    }
    .page canvas { display: block; width: 100%; height: 100%; border-radius: 4px; }
    .page-number {
      position: absolute;
      right: 10px;
      bottom: 8px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(7, 22, 41, .6);
      color: #fff;
      font-size: .75rem;
      font-variant-numeric: tabular-nums;
    }
    .status {
      max-width: 560px;
      margin: 48px auto;
      padding: 22px 24px;
      background: var(--white);
      border: 1px solid var(--line);
      border-left: 4px solid var(--orange);
      border-radius: 14px;
      text-align: center;
    }
    .status[hidden] { display: none; }
    .status a { color: var(--blue); font-weight: 700; }

    /* Handwritten/Digital switch and "Page 3 of 15" with jump-to-page. */
    .format-switch {
      display: inline-flex;
      border: 1px solid #2b4762;
      border-radius: 10px;
      overflow: hidden;
    }
    .format-switch[hidden], .page-jump[hidden], .viewer-pager[hidden], .resume-note[hidden] { display: none; }
    .format-switch a {
      display: inline-flex;
      align-items: center;
      height: 38px;
      padding: 0 12px;
      color: #d9e6ee;
      font-size: .88rem;
      font-weight: 800;
      text-decoration: none;
      white-space: nowrap;
    }
    .format-switch a + a { border-left: 1px solid #2b4762; }
    .format-switch a[href]:not([aria-current]):hover { background: #12304d; color: #fff; }
    .format-switch a[aria-current="page"] { background: var(--blue); color: #fff; }
    .format-switch a[aria-disabled="true"] { opacity: .45; cursor: default; }
    .page-jump {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #d9e6ee;
      font-size: .88rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .page-jump input {
      width: 54px;
      height: 38px;
      padding: 0 4px;
      border: 1px solid #2b4762;
      border-radius: 10px;
      background: transparent;
      color: #fff;
      font: inherit;
      text-align: center;
    }

    /* Previous/Next lesson after the last page. */
    .viewer-pager {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      max-width: 900px;
      margin: 0 auto 56px;
      padding: 0 16px;
    }
    .viewer-pager a {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--white);
      color: var(--ink);
      text-decoration: none;
    }
    .viewer-pager a:hover { border-color: var(--blue); }
    .viewer-pager .next { text-align: right; }
    .viewer-pager .dir { color: var(--muted); font-size: .7rem; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; }
    .viewer-pager .name { font-weight: 800; line-height: 1.25; }

    /* "Opened where you left off" note. */
    .resume-note {
      position: fixed;
      left: 50%;
      bottom: 18px;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 12px;
      width: max-content;
      max-width: calc(100% - 24px);
      padding: 10px 12px 10px 16px;
      border-radius: 12px;
      background: var(--night);
      color: #fff;
      box-shadow: 0 10px 30px rgba(7, 22, 41, .3);
      font-size: .9rem;
      transform: translateX(-50%);
    }
    .resume-note button {
      flex: none;
      padding: 6px 10px;
      border: 1px solid #2b4762;
      border-radius: 8px;
      background: transparent;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .resume-note button:hover { background: #12304d; }
    .page img { display: block; width: 100%; height: 100%; border-radius: 4px; }

    .back-link .long { color: inherit; }
    @media (max-width: 640px) {
      .viewer-bar { padding: 10px 14px; gap: 8px 10px; position: static; }
      .doc-title { flex-basis: 100%; order: -1; }
      .back-link .long { display: none; }
      .controls { margin-left: auto; gap: 6px; }
      .zoom-group button { min-width: 34px; padding: 0 8px; }
      .zoom-group .zoom-level { min-width: 54px; }
      .bar-button { padding: 0 12px; }
      .pages { padding: 14px 8px 48px; gap: 12px; }
      .format-switch a { padding: 0 10px; }
      .page-jump input { width: 46px; }
      .viewer-pager { gap: 10px; padding: 0 8px; }
      .viewer-pager a { padding: 12px; }
      .viewer-pager .name { font-size: .88rem; }
    }

    /* Dark mode follows the device setting; pages stay white like paper. */
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --ink: #e2ecf3;
        --muted: #9db1c0;
        --paper: #0b1625;
        --white: #12263b;
        --line: #25405a;
      }
      .page { background: #fff; box-shadow: 0 10px 30px rgba(0, 0, 0, .45); }
      .status a { color: #8fbaff; }
    }
  </style>
</head>
<body>
  <header class="viewer-bar">
    <a class="back-link" id="back-link" href="/"><span aria-hidden="true">←</span> Back<span class="long"> to lessons</span></a>
    <p class="doc-title"><span id="doc-format">Solution</span><strong id="doc-name">Loading…</strong></p>
    <div class="controls">
      <div class="format-switch" id="format-switch" role="group" aria-label="Version" hidden>
        <a id="switch-handwritten" data-format="handwritten">Handwritten</a>
        <a id="switch-digital" data-format="digital">Digital</a>
      </div>
      <div class="page-jump" id="page-jump" hidden>
        <label for="page-input">Page</label>
        <input id="page-input" type="number" min="1" step="1" inputmode="numeric" value="1">
        <span>of <span id="page-total">1</span></span>
      </div>
      <div class="zoom-group" role="group" aria-label="Zoom">
        <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
        <button type="button" id="zoom-fit" class="zoom-level" aria-label="Fit to width">100%</button>
        <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
      </div>
      <a class="bar-button" id="download-link" href="#" download hidden>Download</a>
    </div>
  </header>

  <main>
    <p class="status" id="status" role="status">Loading solution…</p>
    <div class="pages" id="pages" tabindex="0" aria-label="Solution pages"></div>
    <nav class="viewer-pager" id="viewer-pager" aria-label="More lessons" hidden></nav>
  </main>
  <div class="resume-note" id="resume-note" role="status" hidden>
    <span id="resume-text"></span>
    <button type="button" id="resume-start">Start from page 1</button>
  </div>

  <script src="/lessons.js"></script>
  <script>
    // ----- Which solution to show -----
    const params = new URLSearchParams(location.search);
    const fileName = (params.get('file') || '').toLowerCase();
    const fileMatch = fileName.match(/^lesson-([a-z0-9-]+)-(digital|handwritten)$/);
    const isFormulaSheet = fileName === 'formula-sheet';
    const lessonId = fileMatch ? fileMatch[1] : '';
    const format = fileMatch ? fileMatch[2] : '';
    const pdfPath = fileMatch ? `/pdfs/${fileName}.pdf` : '';
    const downloadPath = isFormulaSheet ? '/images/sph4u-formula-sheet.png' : pdfPath;
    const lessonList = window.SITE_LESSONS || [];
    const lessonIndex = lessonList.findIndex(lesson => lesson.id === lessonId);
    const lesson = lessonList[lessonIndex];
    const lessonTitle = (params.get('title') || '').slice(0, 120)
      || (lesson ? `${lesson.number} ${lesson.title}` : lessonId ? `Lesson ${lessonId}` : isFormulaSheet ? 'SPH4U Formula Sheet' : 'Solution');
    const formatLabel = format === 'handwritten' ? 'Handwritten solution' : format === 'digital' ? 'Clean digital solution'
      : isFormulaSheet ? 'Quick reference' : 'Solution';
    // Read by the page-drawing script below.
    window.viewerFile = pdfPath ? { kind: 'pdf', path: pdfPath, name: fileName, inLessonList: Boolean(lesson) }
      : isFormulaSheet ? { kind: 'image', path: downloadPath, name: fileName, width: 1870, height: 2420 } : null;

    document.getElementById('doc-name').textContent = lessonTitle;
    document.getElementById('doc-format').textContent = formatLabel;
    document.title = `${lessonTitle} · ${formatLabel} · karolsolveskassil.ca`;
    if (lessonId) document.getElementById('back-link').href = `/#${lessonId}`;
    if (isFormulaSheet) document.getElementById('back-link').href = '/#formula-sheet';
    if (downloadPath) {
      const download = document.getElementById('download-link');
      download.href = downloadPath;
      download.hidden = false;
    }

    // ----- Switching version and moving between lessons -----
    const viewerUrl = (item, itemFormat) =>
      `/view/?file=lesson-${item.id}-${itemFormat}&title=${encodeURIComponent(`${item.number} ${item.title}`)}`;
    // Prefer the same version; otherwise the other one; otherwise the lesson on the main page.
    function linkFor(item, posted) {
      const other = format === 'handwritten' ? 'digital' : 'handwritten';
      if (!posted || posted[item.id]?.[format]) return viewerUrl(item, format);
      if (posted[item.id]?.[other]) return viewerUrl(item, other);
      return `/#${item.id}`;
    }
    function showLessonLinks(posted) {
      if (!lesson) return;
      const formatSwitch = document.getElementById('format-switch');
      for (const link of formatSwitch.querySelectorAll('a')) {
        const linkFormat = link.dataset.format;
        if (linkFormat === format) {
          link.setAttribute('aria-current', 'page');
          link.removeAttribute('href');
        } else if (!posted || posted[lesson.id]?.[linkFormat]) {
          link.href = viewerUrl(lesson, linkFormat);
          link.removeAttribute('aria-disabled');
          link.removeAttribute('title');
        } else {
          link.removeAttribute('href');
          link.setAttribute('aria-disabled', 'true');
          link.title = 'Not posted yet';
        }
      }
      formatSwitch.hidden = false;
      const pager = document.getElementById('viewer-pager');
      const cell = (item, direction) => (item ? `
        <a class="${direction}" href="${linkFor(item, posted)}">
          <span class="dir">${direction === 'prev' ? '← Previous lesson' : 'Next lesson →'}</span>
          <span class="name">${item.number} ${item.title}</span>
        </a>` : '<span aria-hidden="true"></span>');
      pager.innerHTML = cell(lessonList[lessonIndex - 1], 'prev') + cell(lessonList[lessonIndex + 1], 'next');
    }
    showLessonLinks(null);
    if (lesson && location.protocol !== 'file:') {
      fetch('/pdfs/posted.json', { cache: 'no-cache' })
        .then(response => (response.ok ? response.json() : null))
        .then(posted => { if (posted) showLessonLinks(posted); })
        .catch(() => { /* Links stay pointed at the same version. */ });
    }

    // ----- Tracking: same rules as the main page -----
    // The lesson page passes its visit ID (v) so reading here continues that visit
    // instead of counting a second one. It is removed from the address bar straight away.
    const engagementApi = 'https://events.karolsolveskassil.ca/';
    const optOutKey = 'siteEngagementOptOut';
    const uuidPattern = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
    function trackingOff() {
      try { return document.cookie.split('; ').includes(`${optOutKey}=1`); }
      catch { return false; }
    }
    const passedVisit = params.get('v');
    try {
      if (passedVisit && uuidPattern.test(passedVisit)) {
        sessionStorage.setItem('siteEngagementVisitId', passedVisit);
        sessionStorage.setItem('siteEngagementSource', 'direct');
      }
    } catch { /* Storage may be blocked; a new visit is used instead. */ }
    if (params.has('v')) {
      try {
        const cleanUrl = new URL(location.href);
        cleanUrl.searchParams.delete('v');
        history.replaceState(null, '', cleanUrl.pathname + cleanUrl.search + cleanUrl.hash);
      } catch { /* The viewer still works if the address can't be cleaned. */ }
    }
    function visitIdForTab() {
      let id = sessionStorage.getItem('siteEngagementVisitId');
      if (!id) {
        id = crypto.randomUUID();
        sessionStorage.setItem('siteEngagementVisitId', id);
      }
      return id;
    }
    function browserIdForVisits() {
      let id = localStorage.getItem('siteEngagementBrowserId');
      if (!id) {
        id = crypto.randomUUID();
        localStorage.setItem('siteEngagementBrowserId', id);
      }
      return id;
    }
    function visitSource() {
      try {
        const saved = sessionStorage.getItem('siteEngagementSource');
        if (saved) return saved;
      } catch { /* Fall through. */ }
      let source = 'direct';
      if (document.referrer) {
        try {
          const host = new URL(document.referrer).hostname.toLowerCase().replace(/^www\./, '');
          if (host && host !== 'karolsolveskassil.ca' && !host.endsWith('.karolsolveskassil.ca')) source = host;
        } catch { /* Keep "direct". */ }
      }
      try { sessionStorage.setItem('siteEngagementSource', source); } catch { /* Resent next time. */ }
      return source;
    }
    function postEvent(path, body, keepalive) {
      return fetch(new URL(path, engagementApi), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
        keepalive,
        cache: 'no-store'
      });
    }
    // "phone", "tablet" or "computer" for the stats page's device split. Worked out
    // from the screen size and whether the main pointer is touch, not the user agent.
    function deviceType() {
      try {
        if (!matchMedia('(pointer: coarse)').matches) return 'computer';
        return Math.min(screen.width, screen.height) < 600 ? 'phone' : 'tablet';
      } catch { return ''; }
    }
    async function sendPresence(visible) {
      if (location.protocol === 'file:') return;
      try {
        if (trackingOff()) return;
        await postEvent('presence', {
          visitId: visitIdForTab(), browserId: browserIdForVisits(), visible,
          ...(visible ? { source: visitSource(), device: deviceType() } : {})
        }, !visible);
      } catch { /* Reading still works if analytics fails. */ }
    }
    if (document.visibilityState === 'visible') sendPresence(true);
    setInterval(() => {
      if (document.visibilityState === 'visible') sendPresence(true);
    }, 30000);
    document.addEventListener('visibilitychange', () => sendPresence(document.visibilityState === 'visible'));
    window.addEventListener('pagehide', () => sendPresence(false));

    // Record each solution the viewer opens, and how it was reached, so PDF views
    // include ones opened with the Handwritten/Digital switch or Previous/Next here.
    // Refreshing the page or going back to it doesn't count again.
    const openedByKey = 'viewerOpenedBy';
    document.addEventListener('click', event => {
      if (!(event.target instanceof Element)) return;
      const link = event.target.closest('#format-switch a[href], #viewer-pager a[href]');
      if (!link || !new URL(link.href, location.href).pathname.startsWith('/view/')) return;
      const how = link.closest('#format-switch') ? 'switch' : link.classList.contains('prev') ? 'prev' : 'next';
      try { sessionStorage.setItem(openedByKey, how); } catch { /* Counted as a direct open instead. */ }
    });
    const navigation = performance.getEntriesByType?.('navigation')[0];
    const reopened = Boolean(navigation && (navigation.type === 'reload' || navigation.type === 'back_forward'));
    // One ID per opened solution. A refresh keeps it (and its reading time) instead of starting over.
    const openKey = `viewerOpen:${fileName}`;
    let openState = null;
    try { if (reopened) openState = JSON.parse(sessionStorage.getItem(openKey) || 'null'); }
    catch { /* Start a new open. */ }
    if (!openState || typeof openState.id !== 'string' || !uuidPattern.test(openState.id)) {
      openState = { id: '', seconds: 0 };
      try { openState.id = crypto.randomUUID(); } catch { /* No tracking without an ID. */ }
    }
    const openId = openState.id;
    (() => {
      let how = passedVisit && uuidPattern.test(passedVisit) ? 'site' : 'direct';
      try {
        how = sessionStorage.getItem(openedByKey) || how;
        sessionStorage.removeItem(openedByKey);
      } catch { /* Keep the guess above. */ }
      if (reopened) return;
      if (location.protocol === 'file:' || !(lessonId || isFormulaSheet) || !openId) return;
      try {
        if (trackingOff()) return;
        postEvent('pdf', {
          openId, visitId: visitIdForTab(),
          lessonId: isFormulaSheet ? 'formula-sheet' : lessonId,
          format: isFormulaSheet ? 'sheet' : format, how
        }, true).catch(() => {});
      } catch { /* Reading still works if analytics fails. */ }
    })();

    // ----- Reading time and how far the solution was read -----
    // Time counts while the viewer is visible and someone scrolled, tapped or pressed a
    // key in the last 2 minutes, so a tab left open doesn't keep adding time.
    // The page-drawing script below fills in readDepth: the furthest page reached and the page count.
    const readDepth = window.viewerReadDepth = { page: 0, pages: 0 };
    const IDLE_MS = 2 * 60 * 1000;
    let readSeconds = Math.max(0, Number(openState.seconds) || 0);
    let lastActive = Date.now();
    let lastTick = Date.now();
    let lastSent = '';
    for (const type of ['scroll', 'wheel', 'pointerdown', 'keydown', 'touchstart']) {
      addEventListener(type, () => { lastActive = Date.now(); }, { capture: true, passive: true });
    }
    setInterval(() => {
      const now = Date.now();
      if (document.visibilityState === 'visible' && now - lastActive < IDLE_MS) {
        readSeconds += Math.min(now - lastTick, 5000) / 1000; // Ignore gaps such as a sleeping laptop.
      }
      lastTick = now;
    }, 1000);
    document.addEventListener('visibilitychange', () => { lastTick = Date.now(); });
    function sendReading(leaving) {
      if (location.protocol === 'file:' || !(lessonId || isFormulaSheet) || !openId || !readDepth.pages) return;
      const seconds = Math.min(Math.round(readSeconds), 14400);
      try { sessionStorage.setItem(openKey, JSON.stringify({ id: openId, seconds })); }
      catch { /* A refresh starts its time from zero instead. */ }
      const report = `${seconds}:${readDepth.page}`;
      if (seconds < 1 || report === lastSent) return;
      try {
        if (trackingOff()) return;
        lastSent = report;
        postEvent('reading', {
          openId, visitId: visitIdForTab(),
          lessonId: isFormulaSheet ? 'formula-sheet' : lessonId,
          format: isFormulaSheet ? 'sheet' : format,
          seconds, page: Math.min(readDepth.page, readDepth.pages), pages: readDepth.pages
        }, leaving).catch(() => {});
      } catch { /* Reading still works if analytics fails. */ }
    }
    setInterval(() => { if (document.visibilityState === 'visible') sendReading(false); }, 30000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') sendReading(true); });
    addEventListener('pagehide', () => sendReading(true));

    // Only the Download button counts as an engagement here; zooming and the back link don't.
    document.getElementById('download-link').addEventListener('click', () => {
      if (location.protocol === 'file:' || !downloadPath) return;
      try {
        if (trackingOff()) return;
        const target = isFormulaSheet ? 'download:formula-sheet' : `download-pdf:${lessonId}:${format}`;
        postEvent('', { clickId: crypto.randomUUID(), target }, true).catch(() => {});
        postEvent('download', { downloadId: crypto.randomUUID(), filePath: downloadPath }, true).catch(() => {});
      } catch { /* The download still works if tracking is blocked. */ }
    });
  </script>

  <script type="module">
    import * as pdfjs from '/vendor/pdf.min.mjs';
    pdfjs.GlobalWorkerOptions.workerSrc = new URL('/vendor/pdf.worker.min.mjs', location.href).href;

    const status = document.getElementById('status');
    const pagesEl = document.getElementById('pages');
    const zoomOut = document.getElementById('zoom-out');
    const zoomIn = document.getElementById('zoom-in');
    const zoomFit = document.getElementById('zoom-fit');
    const viewerFile = window.viewerFile;
    const bar = document.querySelector('.viewer-bar');
    const pageJump = document.getElementById('page-jump');
    const pageInput = document.getElementById('page-input');
    const ZOOMS = [0.5, 0.75, 1, 1.25, 1.5, 2, 2.5, 3];
    let zoom = 1;
    let pdf = null;
    const pages = []; // { element, number, viewport (scale 1), task, renderedAt }

    function showProblem(message) {
      status.innerHTML = message;
      status.hidden = false;
      pagesEl.hidden = true;
      zoomOut.disabled = zoomIn.disabled = zoomFit.disabled = true;
    }

    // Page width at 100%: the space available, up to a comfortable reading width.
    function fitWidth() {
      return Math.max(260, Math.min(pagesEl.clientWidth - 32, 900));
    }
    function cssWidthFor(page) {
      return Math.round(fitWidth() * zoom);
    }
    function sizePage(page) {
      const width = cssWidthFor(page);
      page.element.style.width = `${width}px`;
      page.element.style.height = `${Math.round(width * page.viewport.height / page.viewport.width)}px`;
    }

    async function renderPage(page) {
      if (page.image) return; // The formula sheet is an image; the browser scales it.
      const width = cssWidthFor(page);
      if (page.renderedAt === width) return;
      page.renderedAt = width;
      if (page.task) page.task.cancel();
      try {
        const pdfPage = await pdf.getPage(page.number);
        // Sharp on high-density screens, but capped so very large zooms stay fast.
        const ratio = Math.min(window.devicePixelRatio || 1, 2, 4096 / width);
        const viewport = pdfPage.getViewport({ scale: width / page.viewport.width * ratio });
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(viewport.width);
        canvas.height = Math.round(viewport.height);
        page.task = pdfPage.render({ canvasContext: canvas.getContext('2d'), canvas, viewport });
        await page.task.promise;
        page.task = null;
        page.element.querySelector('canvas')?.remove();
        page.element.prepend(canvas);
      } catch (error) {
        if (error?.name === 'RenderingCancelledException') return;
        page.renderedAt = null;
        page.element.querySelector('.page-number').textContent = `Page ${page.number} could not be shown`;
      }
    }

    const observer = new IntersectionObserver(entries => {
      for (const entry of entries) {
        if (entry.isIntersecting) renderPage(pages[Number(entry.target.dataset.index)]);
      }
    }, { rootMargin: '600px 0px' });

    function isNearView(element) {
      const box = element.getBoundingClientRect();
      return box.bottom > -600 && box.top < innerHeight + 600;
    }
    function applyZoom(newZoom) {
      // Keep the same spot in the document in view while zooming.
      const scrollRatio = document.documentElement.scrollHeight
        ? scrollY / document.documentElement.scrollHeight : 0;
      zoom = newZoom;
      zoomFit.textContent = `${Math.round(zoom * 100)}%`;
      zoomOut.disabled = zoom <= ZOOMS[0];
      zoomIn.disabled = zoom >= ZOOMS[ZOOMS.length - 1];
      for (const page of pages) sizePage(page);
      scrollTo(scrollX, scrollRatio * document.documentElement.scrollHeight);
      for (const page of pages) if (isNearView(page.element)) renderPage(page);
    }
    zoomIn.addEventListener('click', () => {
      const next = ZOOMS.find(level => level > zoom);
      if (next) applyZoom(next);
    });
    zoomOut.addEventListener('click', () => {
      const previous = [...ZOOMS].reverse().find(level => level < zoom);
      if (previous) applyZoom(previous);
    });
    zoomFit.addEventListener('click', () => applyZoom(1));

    let resizeTimer;
    new ResizeObserver(() => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => { if (pages.length) applyZoom(zoom); }, 150);
    }).observe(pagesEl);

    // ----- Page number, jump to page, and reopening where the student left off -----
    // The reading line sits a third of the way down the screen, below the sticky bar.
    function barHeight() {
      return getComputedStyle(bar).position === 'sticky' ? bar.offsetHeight : 0;
    }
    function readingLine() {
      return barHeight() + (innerHeight - barHeight()) * 0.3;
    }
    function currentPosition() {
      const line = readingLine();
      let current = pages[0];
      for (const page of pages) {
        if (page.element.getBoundingClientRect().top <= line) current = page;
        else break;
      }
      const box = current.element.getBoundingClientRect();
      return { page: current.number, fraction: Math.min(Math.max((line - box.top) / box.height, 0), 1) };
    }
    function scrollToPosition(number, fraction = 0) {
      const page = pages[Math.min(Math.max(number, 1), pages.length) - 1];
      const box = page.element.getBoundingClientRect();
      const target = fraction ? box.top + fraction * box.height - readingLine() : box.top - barHeight() - 12;
      scrollTo(scrollX, scrollY + target);
    }
    pageInput.addEventListener('change', () => {
      const number = Math.round(Number(pageInput.value));
      if (number >= 1 && pages.length) scrollToPosition(number);
    });
    pageInput.addEventListener('keydown', event => {
      if (event.key !== 'Enter') return;
      event.preventDefault();
      pageInput.dispatchEvent(new Event('change'));
    });

    const resumeNote = document.getElementById('resume-note');
    let resumeTimer;
    let resumeScrollY = 0;
    const positionKey = viewerFile ? `viewerPosition:${viewerFile.name}` : '';
    let tracking = false;
    let saveTimer;
    function savePosition() {
      if (!tracking) return;
      try { localStorage.setItem(positionKey, JSON.stringify(currentPosition())); }
      catch { /* Reading still works; the place just isn't remembered. */ }
    }
    // Furthest page reached, for the reading stats. The bottom of the document counts
    // as the last page, since a short last page may never reach the reading line.
    function noteDepth() {
      const depth = window.viewerReadDepth;
      if (!depth || !pages.length) return;
      const atEnd = innerHeight + scrollY >= document.documentElement.scrollHeight - 8;
      depth.pages = pages.length;
      depth.page = Math.max(depth.page, atEnd ? pages.length : currentPosition().page);
    }
    let frame = 0;
    addEventListener('scroll', () => {
      if (!tracking || frame) return;
      frame = requestAnimationFrame(() => {
        frame = 0;
        noteDepth();
        if (document.activeElement !== pageInput) pageInput.value = String(currentPosition().page);
        if (!resumeNote.hidden && Math.abs(scrollY - resumeScrollY) > 300) hideResumeNote();
        clearTimeout(saveTimer);
        saveTimer = setTimeout(savePosition, 300);
      });
    }, { passive: true });
    addEventListener('pagehide', savePosition);

    function hideResumeNote() {
      resumeNote.hidden = true;
      clearTimeout(resumeTimer);
    }
    document.getElementById('resume-start').addEventListener('click', () => {
      scrollToPosition(1);
      hideResumeNote();
    });
    function restorePosition() {
      let saved = null;
      try { saved = JSON.parse(localStorage.getItem(positionKey) || 'null'); }
      catch { /* Start at the top. */ }
      if (saved && Number.isInteger(saved.page) && saved.page <= pages.length && (saved.page > 1 || saved.fraction > .2)) {
        scrollToPosition(saved.page, Number(saved.fraction) || 0);
        document.getElementById('resume-text').textContent = `Opened where you left off: page ${saved.page}.`;
        resumeNote.hidden = false;
        resumeScrollY = scrollY;
        resumeTimer = setTimeout(hideResumeNote, 9000);
      }
      pageInput.value = String(currentPosition().page);
      tracking = true;
      noteDepth();
    }

    function showImage() {
      const element = document.createElement('div');
      element.className = 'page';
      element.dataset.index = '0';
      const image = document.createElement('img');
      image.src = viewerFile.path;
      image.alt = 'SPH4U physics formula sheet with equations for kinematics, dynamics, energy, collisions, fields, waves, and relativity';
      element.append(image);
      const page = { element, number: 1, viewport: { width: viewerFile.width, height: viewerFile.height }, image: true };
      pages.push(page);
      sizePage(page);
      pagesEl.append(element);
      status.hidden = true;
      zoomOut.disabled = zoom <= ZOOMS[0];
      const depth = window.viewerReadDepth;
      if (depth) depth.page = depth.pages = 1;
    }

    async function load() {
      if (!viewerFile) {
        showProblem('This link doesn\'t point to a solution. <a href="/">Go to the lessons</a>.');
        return;
      }
      if (viewerFile.kind === 'image') {
        showImage();
        return;
      }
      const pdfPath = viewerFile.path;
      try {
        pdf = await pdfjs.getDocument(pdfPath).promise;
      } catch {
        showProblem(`This solution couldn't be loaded. It may not be published yet. <a href="/">Go back to the lessons</a> or <a href="${pdfPath}">open the PDF file directly</a>.`);
        return;
      }
      const first = await pdf.getPage(1);
      const baseViewport = first.getViewport({ scale: 1 });
      for (let number = 1; number <= pdf.numPages; number++) {
        const element = document.createElement('div');
        element.className = 'page';
        element.dataset.index = String(number - 1);
        element.setAttribute('role', 'img');
        element.setAttribute('aria-label', `Page ${number} of ${pdf.numPages}`);
        element.innerHTML = `<span class="page-number" aria-hidden="true">${number} / ${pdf.numPages}</span>`;
        const viewport = number === 1 ? baseViewport : (await pdf.getPage(number)).getViewport({ scale: 1 });
        const page = { element, number, viewport, task: null, renderedAt: null };
        pages.push(page);
        sizePage(page);
        pagesEl.append(element);
        observer.observe(element);
      }
      status.hidden = true;
      zoomOut.disabled = zoom <= ZOOMS[0];
      document.getElementById('page-total').textContent = String(pdf.numPages);
      pageInput.max = String(pdf.numPages);
      pageJump.hidden = false;
      document.getElementById('viewer-pager').hidden = !viewerFile.inLessonList;
      restorePosition();
    }
    load();
  </script>
</body>
</html>
